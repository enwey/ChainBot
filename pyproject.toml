[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-automation"
version = "0.1.0"
description = "Solana opportunity monitoring and trading automation service."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "websockets>=12.0",
  "solana>=0.36.6",
  "solders>=0.21.0",
]

[project.scripts]
investment-automation = "investment_automation.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
