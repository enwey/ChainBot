groups:
  - name: chainbot
    rules:
      - alert: ChainBotNotReady
        expr: chainbot_ready == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: ChainBot readiness is degraded
      - alert: ChainBotDependencyFailuresOpen
        expr: chainbot_dependency_open_failures > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ChainBot has unresolved dependency failures
      - alert: ChainBotRuntimeShutdown
        expr: chainbot_runtime_shutdown_active > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: ChainBot runtime safety stop is active
